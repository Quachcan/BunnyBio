<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bunny Evil Bio</title>
    <meta name="description" content="Bunny Evil — Bunny sly. Facebook, Instagram, X, Discord và chỗ mua cà rốt cho thỏ 🐰">

    <!-- Ảnh xem trước khi chia sẻ link (Facebook, Discord, X...).
         og:image / og:url phải là URL đầy đủ — đổi theo nếu đổi domain Vercel. -->
    <link rel="canonical" href="https://bunnysly-bio.vercel.app/">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://bunnysly-bio.vercel.app/">
    <meta property="og:title" content="Bunny Evil">
    <meta property="og:description" content="Bunny sly — tất cả link của Bunny ở một chỗ 🐰">
    <meta property="og:image" content="https://bunnysly-bio.vercel.app/images/Avatar.jpg">
    <meta name="twitter:card" content="summary">
    <meta name="theme-color" content="#0a0a0a">

    <!-- Có JS thì bật class "js" ngay (trước khi vẽ trang) để CSS ẩn nội dung chờ
         màn loading. Nếu js/script.js không chạy được (lỗi, bị chặn...) thì sau 4s
         tự gỡ màn loading và hiện trang, thay vì kẹt mãi ở màn đen. -->
    <script>
        document.documentElement.classList.add("js");

        // Theme theo mùa — tự bật trong khoảng ngày [tháng, ngày] (giờ máy người xem).
        // Xem thử bất kỳ lúc nào: ?theme=halloween / christmas / tet — tắt hẳn: ?theme=default
        // Thêm mùa mới: thêm 1 dòng ở đây + 1 file css/<tên>.css (khoảng ngày không vắt qua năm mới).
        (function () {
            var seasons = [
                { name: "halloween", from: [10, 20], to: [11, 1] },
                { name: "christmas", from: [12, 10], to: [12, 31] }
            ];

            // Tết theo âm lịch nên mỗi năm một ngày: [tháng, ngày] dương lịch của Mùng 1.
            // Bật từ 10 ngày trước Tết đến hết Mùng 7 — nhớ thêm năm mới vào đây khi hết danh sách.
            var tetMung1 = { 2027: [2, 6], 2028: [1, 26], 2029: [2, 13], 2030: [2, 3], 2031: [1, 23] };

            var param = new URLSearchParams(location.search).get("theme");
            var now = new Date(), today = (now.getMonth() + 1) * 100 + now.getDate();
            var active = null;
            seasons.forEach(function (s) {
                var inSeason = today >= s.from[0] * 100 + s.from[1] && today <= s.to[0] * 100 + s.to[1];
                if (param === s.name || (!param && inSeason)) active = s.name;
            });

            var mung1 = tetMung1[now.getFullYear()];
            var dayMs = 24 * 60 * 60 * 1000;
            if (mung1) {
                var tet = new Date(now.getFullYear(), mung1[0] - 1, mung1[1]);
                var daysFromTet = Math.floor((now - tet) / dayMs);
                if (!param && daysFromTet >= -10 && daysFromTet <= 6) active = "tet";
            }
            if (param === "tet") active = "tet";
            if (active) document.documentElement.classList.add(active);
        })();

        setTimeout(function () {
            if (window.__bioEntranceStarted) return;
            var logo = document.querySelector(".entrance-logo");
            var wrapper = document.querySelector(".avatar-wrapper");
            if (logo && wrapper) {
                logo.classList.remove("entrance-logo");
                logo.alt = "Bunny Profile";
                wrapper.appendChild(logo);
            }
            document.documentElement.classList.remove("js");
        }, 4000);
    </script>

    <!-- Các thư viện bên ngoài (External Libraries) -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;900&family=Qwitcher+Grypen:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="icon" type="image/jpeg" href="images/Avatar.jpg">
    
    <!-- Link tới file giao diện của bạn -->
    <link rel="stylesheet" href="css/style.css">
    <!-- Theme theo mùa: mọi rule đều nằm dưới html.<tên mùa>, không bật thì không ảnh hưởng gì -->
    <link rel="stylesheet" href="css/halloween.css">
    <link rel="stylesheet" href="css/christmas.css">
    <link rel="stylesheet" href="css/tet.css">
</head>

<body>

    <div id="entrance-overlay">
        <!-- The masked black backdrop lives on its own leaf element, separate
             from the avatar/text below — so the mask hole can never hide them,
             only reveal what's behind the backdrop itself. -->
        <div class="entrance-backdrop"></div>
        <img src="images/Avatar.jpg" alt="Loading" class="entrance-logo">
        <div class="loading-text" data-text="Bunny sly">Bunny sly</div>
    </div>

    <div id="particles-js"></div>

    <div class="container">
        <!-- Header -->
        <div class="title">BUNNY EVIL</div>
        <div class="subtitle">Bunny sly</div>

        <div class="avatar-wrapper">
            <!-- Intentionally empty: the loading-screen avatar (.entrance-logo)
                 is this same <img> element — script.js moves it in here once
                 loading finishes, instead of swapping to a lookalike copy. -->
            <noscript><img src="images/Avatar.jpg" alt="Bunny Profile"></noscript>
        </div>
        <!-- Chấm báo ảnh avatar đang hiện (JS tự tạo khi BIO_CONFIG.avatarPhotos có ảnh) -->
        <div class="avatar-dots" aria-hidden="true"></div>

        <!-- Câu tagline dưới avatar — sửa thoải mái -->
        <p class="tagline">sweet face, sly soul</p>

        <!-- Gallery được script.js dựng ở đây từ BIO_CONFIG.galleryPhotos -->

        <div class="talks-text">TALKS</div>

        <!-- Links -->
        <div class="links-container">
            <a href="https://www.facebook.com/profile.php?id=61595059121978" class="link-btn" target="_blank">
                <i class="fa-brands fa-facebook"></i> Facebook
            </a>

            <a href="https://www.instagram.com/_bunny.tit_" class="link-btn" target="_blank">
                <i class="fa-brands fa-instagram"></i> Instagram
            </a>
            
            <a href="https://x.com/verdet_vtra" class="link-btn" target="_blank">
                <i class="fa-brands fa-x-twitter"></i> X (Twitter)
            </a>

            <a href="https://discord.gg/KvgXXAsXFG" class="link-btn" target="_blank">
                <i class="fa-brands fa-discord"></i> Discord
            </a>

            <!-- <a href="https://ganknow.com/bunnytits" class="link-btn" target="_blank">
                <img src="images/Gank-icon.jpg" alt="Gank" style="width: 36px; height: 36px; right: 10px; border-radius: 4px;">
                Ganknow
            </a> -->
            
            <button id="btn-donate" class="link-btn" style="width: 100%;">
                <i class="fa-solid fa-carrot"></i> Buy me a carrot 🐰
            </button>
        </div>

        <!-- Donate QR -->
        <div class="donate-wrapper">
            <div class="kaomoji">ε ⋒ x ⋒ 3</div>
            
            <div class="qr-container" id="qrSection">
                <div class="qr-box">
                    <img src="images/qr-code.jpg" alt="QR Code">
                </div>

                <div class="qr-box">
                    <img src="images/qr-code-2.jpg" alt="QR Code">
                </div>

                <div class="qr-box">
                    <img src="images/qr-code-3.jpg" alt="QR Code">
                </div>
            </div>
        </div>
    </div>

    <!-- CÁC THƯ VIỆN HIỆU ỨNG JS -->
    <!-- script.js chạy trước để màn loading không phải chờ CDN; hai thư viện hiệu ứng
         tải "defer" và được khởi tạo trong DOMContentLoaded. -->
    <script src="js/config.js"></script>
    <script src="js/script.js"></script>
    <script defer src="https://cdnjs.cloudflare.com/ajax/libs/vanilla-tilt/1.8.1/vanilla-tilt.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>

    <div class="bunny-runner"></div>
</body>
</html>
